<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack.min.css" rel="stylesheet"/>
  <style>
    .sidebar { width: 200px; float: left; }
    .new-widget { cursor: grab; background: #eee; margin: 10px; padding: 10px; text-align: center; border: 1px solid #ccc; }
    .grid-container { margin-left: 220px; background: #fafafa; min-height: 500px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="new-widget grid-stack-item" gs-w="2" gs-h="2">
      <div class="grid-stack-item-content">Drag Me</div>
    </div>
  </div>
  <div class="grid-container">
    <div class="grid-stack" id="layoutGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack-all.js"></script>
  <script>
    GridStack.setupDragIn('.new-widget', { appendTo: 'body', helper: 'clone' });

    let grid = GridStack.init({
      cellHeight: 60,
      acceptWidgets: true,
      dragIn: '.new-widget',
      dragInOptions: { appendTo: 'body', helper: 'clone' }
    });
  </script>
</body>
</html>
