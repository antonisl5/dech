<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack.min.css" rel="stylesheet"/>
  <style type="text/css">
    .grid-stack { background: #fafafa; min-height: 500px; }
    .sidebar { background: #ccc; float: left; width: 200px; min-height: 500px;}
    .sidebar .grid-stack-item {
      background: #fff; border: 1px solid #ddd; padding: 10px; margin: 10px; cursor: move;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="grid-stack-item" gs-w="2" gs-h="2">
      <div class="grid-stack-item-content">Widget</div>
    </div>
  </div>
  <div style="margin-left: 220px;">
    <div class="grid-stack"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack-all.js"></script>
  <script type="text/javascript">
    let grid = GridStack.init({
      cellHeight: 70,
      acceptWidgets: true,
      removable: '#trash',
    });

    GridStack.setupDragIn('.sidebar .grid-stack-item', { appendTo: 'body', helper: 'clone' });
  </script>
</body>
</html>
